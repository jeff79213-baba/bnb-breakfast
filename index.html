<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>早餐管理</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#e8590c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="早餐管理">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <h1>🍳 早餐管理</h1>
    <div id="todayLabel" class="today-label"></div>
  </div>
  <button id="menuBtn" class="icon-btn" aria-label="功能選單">☰</button>
</header>

<main>
  <!-- 統計區 -->
  <section class="stats-section">
    <div class="stats-grid">
      <button class="stat-card hot" data-filter="hot">
        <span class="stat-num" id="statHot">0</span>
        <span class="stat-label">🔥 熱食</span>
      </button>
      <button class="stat-card normal" data-filter="normal">
        <span class="stat-num" id="statNormal">0</span>
        <span class="stat-label">🥐 一般</span>
      </button>
      <button class="stat-card done" data-filter="completed">
        <span class="stat-num" id="statDone">0</span>
        <span class="stat-label">✅ 已用餐</span>
      </button>
      <button class="stat-card pending" data-filter="pending">
        <span class="stat-num" id="statPending">0</span>
        <span class="stat-label">⏳ 未用餐</span>
      </button>
    </div>

    <div class="progress-wrap">
      <div class="progress-text"><span id="progressLabel">0 / 0 間</span></div>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <!-- 熱食警示（核心快速功能） -->
    <button id="hotAlertBanner" class="hot-banner hidden"></button>
  </section>

  <!-- 篩選列 -->
  <nav class="chips" id="filterChips">
    <button class="chip active" data-filter="all">全部</button>
    <button class="chip hot" data-filter="hot">🔥 熱食</button>
    <button class="chip normal" data-filter="normal">🥐 一般</button>
    <button class="chip pending" data-filter="pending">⏳ 未用餐</button>
    <button class="chip done" data-filter="completed">✅ 已用餐</button>
  </nav>

  <!-- 房號卡片 -->
  <section class="grid" id="roomGrid"></section>

  <!-- 空白狀態 -->
  <section class="empty-state hidden" id="emptyState">
    <div class="empty-icon">🍽️</div>
    <p class="empty-title">還沒有任何房號</p>
    <p class="empty-sub">先新增房號並選擇早餐種類，或直接匯入 Excel / CSV 資料</p>
    <div class="empty-actions">
      <button class="btn primary" id="emptyAddBtn">➕ 新增房號</button>
      <button class="btn" id="emptyImportBtn">📂 匯入資料</button>
    </div>
  </section>
</main>

<!-- 功能選單 -->
<div class="modal-backdrop hidden" id="menuModal">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>功能選單</h2>
    <button class="btn list-btn" id="menuManageBtn">🏠 管理房號</button>
    <button class="btn list-btn" id="menuImportBtn">📂 匯入資料（Excel / CSV）</button>
    <button class="btn list-btn" id="menuExportBtn">📤 匯出今日紀錄</button>
    <button class="btn list-btn subtle" id="menuCloseBtn">關閉</button>
  </div>
</div>

<!-- 管理房號 -->
<div class="modal-backdrop hidden" id="manageModal">
  <div class="sheet tall">
    <div class="sheet-handle"></div>
    <h2>管理房號</h2>
    <div class="add-row">
      <input type="text" id="newRoomInput" inputmode="numeric" placeholder="輸入房號，可用逗號一次加入多間">
      <select id="newRoomType"></select>
      <button class="btn primary" id="addRoomBtn">新增</button>
    </div>
    <div class="manage-list" id="manageList"></div>
    <button class="btn subtle full" id="manageCloseBtn">完成</button>
  </div>
</div>

<!-- 匯入預覽 -->
<div class="modal-backdrop hidden" id="importModal">
  <div class="sheet tall">
    <div class="sheet-handle"></div>
    <h2>匯入預覽</h2>
    <div id="importSummary" class="import-summary"></div>
    <div id="importIssues" class="import-issues"></div>
    <div id="importPreviewList" class="import-preview"></div>
    <p class="hint">⚠️ 匯入會取代現有的房號清單（用餐紀錄保留）</p>
    <div class="row-actions">
      <button class="btn danger" id="importCancelBtn">取消</button>
      <button class="btn primary" id="importConfirmBtn">確認匯入</button>
    </div>
  </div>
</div>

<!-- 單一房號動作 -->
<div class="modal-backdrop hidden" id="roomModal">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="roomModalTitle">101</h2>
    <label class="field-label">早餐種類</label>
    <select id="roomModalType"></select>
    <div class="row-actions">
      <button class="btn danger" id="roomDeleteBtn">刪除房號</button>
      <button class="btn primary" id="roomSaveBtn">儲存</button>
    </div>
    <button class="btn subtle full" id="roomCloseBtn">取消</button>
  </div>
</div>

<input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.txt,.tsv" hidden>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
