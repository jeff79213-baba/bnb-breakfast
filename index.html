<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>早餐管理</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#e8590c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="早餐管理">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <h1>🍳 早餐管理</h1>
    <div id="todayLabel" class="today-label"></div>
  </div>
  <button id="menuBtn" class="icon-btn" aria-label="功能選單">☰</button>
</header>

<main>
  <!-- 統計區 -->
  <section class="stats-section">
    <div class="stats-grid" style="grid-template-columns:repeat(5,1fr)">
      <button class="stat-card hot" data-filter="hot">
        <span class="stat-num" id="statHot">0</span>
        <span class="stat-label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e8590c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:3px"><path d="M6 16 Q6 20 12 20 Q18 20 18 16"/><path d="M6 16 H18"/><path d="M8 7 C8 8.2 9 8.8 8 10 C7 11.2 9 11.8 8 13"/><path d="M12 5 C12 6.2 13 6.8 12 8 C11 9.2 13 9.8 12 11"/><path d="M16 7 C16 8.2 17 8.8 16 10 C15 11.2 17 11.8 16 13"/></svg>熟食</span>
      </button>
      <button class="stat-card normal" data-filter="normal">
        <span class="stat-num" id="statNormal">0</span>
        <span class="stat-label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f9e44" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:3px"><rect x="5" y="8" width="14" height="10" rx="2"/><path d="M5 12 H19"/><path d="M7 10 H7.01"/><path d="M10 14 H10.01"/><path d="M13 10 H13.01"/></svg>一般</span>
      </button>
      <button class="stat-card addon" data-filter="addon" style="border-top:3px solid #fcc419">
        <span class="stat-num" id="statAddon" style="color:#e67700">0</span>
        <span class="stat-label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e67700" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:3px"><circle cx="12" cy="12" r="8.6"/><path d="M14.6 9.2 H10.9 A1.55 1.55 0 0 0 10.9 12.3 H13.1 A1.55 1.55 0 0 1 13.1 15.4 H9.4"/><path d="M12 7.2 V9.2"/><path d="M12 13.4 V15.4"/></svg>加購</span>
      </button>
      <button class="stat-card done" data-filter="completed">
        <span class="stat-num" id="statDone">0</span>
        <span class="stat-label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1971c2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:3px"><circle cx="9" cy="7" r="2.2"/><path d="M9 9.5 V13"/><path d="M6 12 H12"/><path d="M6 13 V16"/><path d="M12 13 V16"/><rect x="13.5" y="11" width="5" height="3" rx="0.8"/><path d="M15 14 V16 H17"/></svg>已用餐</span>
      </button>
      <button class="stat-card pending" data-filter="pending">
        <span class="stat-num" id="statPending">0</span>
        <span class="stat-label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e67700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:3px"><path d="M3.5 15 H7 L3.5 18.5 H7"/><path d="M8.5 9.5 H13.5 L8.5 14.5 H13.5"/><path d="M14 3 H21 L14 10 H21"/></svg>未用餐</span>
      </button>
    </div>

    <div class="progress-wrap">
      <div class="progress-text"><span id="progressLabel">0 / 0 間</span></div>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <!-- 熱食警示（核心快速功能） -->
    <button id="hotAlertBanner" class="hot-banner hidden"></button>
  </section>

  <!-- 篩選列 -->
  <nav class="chips" id="filterChips">
    <button class="chip active" data-filter="all">全部</button>
    <button class="chip hot" data-filter="hot">🔥 熱食</button>
    <button class="chip normal" data-filter="normal">🥐 一般</button>
    <button class="chip pending" data-filter="pending">⏳ 未用餐</button>
    <button class="chip done" data-filter="completed">✅ 已用餐</button>
  </nav>

  <!-- 房號卡片 -->
  <section class="grid" id="roomGrid"></section>

  <!-- 空白狀態 -->
  <section class="empty-state hidden" id="emptyState">
    <div class="empty-icon">🍽️</div>
    <p class="empty-title">還沒有任何房號</p>
    <p class="empty-sub">先新增房號並選擇早餐種類，或直接匯入 Excel / CSV 資料</p>
    <div class="empty-actions">
      <button class="btn primary" id="emptyAddBtn">➕ 新增房號</button>
      <button class="btn" id="emptyImportBtn">📂 匯入資料</button>
    </div>
  </section>
</main>

<!-- 功能選單 -->
<div class="modal-backdrop hidden" id="menuModal">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>功能選單</h2>
    <button class="btn list-btn" id="menuManageBtn">🏠 管理房號</button>
    <button class="btn list-btn" id="menuImportBtn">📂 匯入資料（Excel / CSV）</button>
    <button class="btn list-btn" id="menuPrepBtn">🧮 備料區</button>
    <button class="btn list-btn" id="menuExportBtn">📤 匯出今日紀錄</button>
    <button class="btn list-btn subtle" id="menuCloseBtn">關閉</button>
  </div>
</div>

<!-- 管理房號 -->
<div class="modal-backdrop hidden" id="manageModal">
  <div class="sheet tall">
    <div class="sheet-handle"></div>
    <h2>管理房號</h2>
    <div class="add-row">
      <input type="text" id="newRoomInput" inputmode="numeric" placeholder="輸入房號，可用逗號一次加入多間">
      <select id="newRoomType"></select>
      <button class="btn primary" id="addRoomBtn">新增</button>
    </div>
    <div class="manage-list" id="manageList"></div>
    <button class="btn subtle full" id="manageCloseBtn">完成</button>
  </div>
</div>

<!-- 匯入預覽 -->
<div class="modal-backdrop hidden" id="importModal">
  <div class="sheet tall">
    <div class="sheet-handle"></div>
    <h2>匯入預覽</h2>
    <div id="importSummary" class="import-summary"></div>
    <div id="importIssues" class="import-issues"></div>
    <div id="importPreviewList" class="import-preview"></div>
    <p class="hint">⚠️ 匯入會取代現有的房號清單（用餐紀錄保留）</p>
    <div class="row-actions">
      <button class="btn danger" id="importCancelBtn">取消</button>
      <button class="btn primary" id="importConfirmBtn">確認匯入</button>
    </div>
  </div>
</div>

<!-- 單一房號動作 -->
<div class="modal-backdrop hidden" id="roomModal">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="roomModalTitle">101</h2>
    <label class="field-label">早餐種類</label>
    <select id="roomModalType"></select>
    <div class="row-actions">
      <button class="btn danger" id="roomDeleteBtn">刪除房號</button>
      <button class="btn primary" id="roomSaveBtn">儲存</button>
    </div>
    <button class="btn subtle full" id="roomCloseBtn">取消</button>
  </div>
</div>

<!-- 不加購改加購 -->
<div class="modal-backdrop hidden" id="mealEditModal">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="mealEditTitle">修改用餐</h2>
    <p class="hint" id="mealEditHint"></p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
      <label>大人 <input type="number" id="mealAdultInput" inputmode="numeric" min="0" style="width:100%;min-height:52px;border:2px solid #dee2e6;border-radius:12px;padding:0 14px;font-size:18px"></label>
      <label>小孩 <input type="number" id="mealChildInput" inputmode="numeric" min="0" style="width:100%;min-height:52px;border:2px solid #dee2e6;border-radius:12px;padding:0 14px;font-size:18px"></label>
    </div>
    <label class="field-label">付款狀態</label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button type="button" id="payPaidBtn" class="btn" style="min-height:56px">已付</button>
      <button type="button" id="payUnpaidBtn" class="btn" style="min-height:56px">待付</button>
    </div>
    <div id="mealTypeRow">
      <label class="field-label">加購種類</label>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
        <button type="button" id="mealTypeNormalBtn" class="btn" style="min-height:56px">正常</button>
        <button type="button" id="mealTypeEggBtn" class="btn" style="min-height:56px">蛋奶</button>
        <button type="button" id="mealTypeVeganBtn" class="btn" style="min-height:56px">全素</button>
      </div>
    </div>
    <div class="row-actions">
      <button class="btn" id="mealCancelBtn">取消</button>
      <button class="btn primary" id="mealSaveBtn">確認改為加購</button>
    </div>
  </div>
</div>

<!-- 新訂單房號編輯（房號與來源唯讀） -->
<div class="modal-backdrop hidden" id="orderEditModal">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="orderEditTitle">修改房號</h2>
    <p class="hint" id="orderEditSource"></p>
    <label class="field-label">房號（現場換房可改）</label>
    <input type="text" id="orderRoomNoInput" inputmode="text" style="width:100%;min-height:52px;border:2px solid #dee2e6;border-radius:12px;padding:0 14px;font-size:20px;font-weight:800">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px">
      <label>大人<input type="number" id="orderAdultInput" inputmode="numeric" min="0" style="width:100%;min-height:52px;border:2px solid #dee2e6;border-radius:12px;padding:0 14px;font-size:18px"></label>
      <label>孩童<input type="number" id="orderChildInput" inputmode="numeric" min="0" style="width:100%;min-height:52px;border:2px solid #dee2e6;border-radius:12px;padding:0 14px;font-size:18px"></label>
      <label>嬰幼兒<input type="number" id="orderInfantInput" inputmode="numeric" min="0" style="width:100%;min-height:52px;border:2px solid #dee2e6;border-radius:12px;padding:0 14px;font-size:18px"></label>
    </div>
    <label class="field-label">用餐時間</label>
    <input type="text" id="orderTimeInput" placeholder="例如 8:15" style="width:100%;min-height:52px;border:2px solid #dee2e6;border-radius:12px;padding:0 14px;font-size:18px">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px">
      <label>狀態
        <select id="orderStatusInput" style="width:100%;min-height:52px;border:2px solid #dee2e6;border-radius:12px;padding:0 10px;font-size:16px">
          <option value="">（空）</option>
          <option value="續住">續住</option>
        </select>
      </label>
      <label>蛋奶
        <select id="orderEggMilkInput" style="width:100%;min-height:52px;border:2px solid #dee2e6;border-radius:12px;padding:0 10px;font-size:16px">
          <option value="">（空）</option>
          <option value="加購">加購（正常）</option>
          <option value="蛋奶加購">蛋奶加購</option>
          <option value="全素加購">全素加購</option>
        </select>
      </label>
      <label>全素
        <select id="orderVeganInput" style="width:100%;min-height:52px;border:2px solid #dee2e6;border-radius:12px;padding:0 10px;font-size:16px">
          <option value="">（空）</option>
          <option value="不加購">不加購</option>
        </select>
      </label>
    </div>
    <div class="row-actions">
      <button class="btn" id="orderCancelBtn">取消</button>
      <button class="btn primary" id="orderSaveBtn">儲存</button>
    </div>
  </div>
</div>

<!-- 備料區 -->
<div class="modal-backdrop hidden" id="prepModal">
  <div class="sheet tall">
    <div class="sheet-handle"></div>
    <h2>🧮 備料區</h2>
    <div id="prepSumLine" class="import-summary"></div>
    <div id="prepHotLine" class="hint" style="margin-top:4px"></div>

    <h3 style="margin:16px 0 6px">果凍奶酪 <span class="hint">總量＝總人數×比例；應做＝需要−庫存</span></h3>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <label class="hint">比例<input type="number" id="jellyRatio" step="0.05" min="0" style="width:100%;min-height:48px;border:2px solid #dee2e6;border-radius:10px;padding:0 10px;font-size:16px"></label>
      <label class="hint">果凍庫存<input type="number" id="jellyStock" min="0" style="width:100%;min-height:48px;border:2px solid #dee2e6;border-radius:10px;padding:0 10px;font-size:16px"></label>
      <label class="hint">奶酪庫存<input type="number" id="cheeseStock" min="0" style="width:100%;min-height:48px;border:2px solid #dee2e6;border-radius:10px;padding:0 10px;font-size:16px"></label>
    </div>
    <div style="margin-top:8px">
      <label class="hint">奶酪除數（奶酪需要＝總量÷除數，單一品項）<input type="number" id="cheeseDiv" min="1" style="width:100%;min-height:48px;border:2px solid #dee2e6;border-radius:10px;padding:0 10px;font-size:16px"></label>
    </div>
    <div class="import-summary" style="margin-top:6px">總量 <b id="jellyTotal">0</b>　奶酪應做 <b id="cheeseNum">0</b>　果凍應做 <b id="jellyNum">0</b></div>
    <div class="hint" style="margin-top:10px">果凍品項分配（已分配 <b id="jellyAllocated">0</b>　剩餘 <b id="jellyRemain">0</b>）</div>
    <div id="jellyItems" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px"></div>

    <h3 style="margin:16px 0 6px">茶葉蛋 <span class="hint">應煮＝總人數×比例−庫存＋預留顆＋比例×預留％</span></h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <label class="hint">比例<input type="number" id="eggRatio" step="0.1" min="0" style="width:100%;min-height:48px;border:2px solid #dee2e6;border-radius:10px;padding:0 10px;font-size:16px"></label>
      <label class="hint">庫存<input type="number" id="eggStock" min="0" style="width:100%;min-height:48px;border:2px solid #dee2e6;border-radius:10px;padding:0 10px;font-size:16px"></label>
      <label class="hint">預留多煮（顆）<input type="number" id="eggExtra" min="0" style="width:100%;min-height:48px;border:2px solid #dee2e6;border-radius:10px;padding:0 10px;font-size:16px"></label>
      <label class="hint">預留多煮（％）<input type="number" id="eggReservePct" step="5" min="0" style="width:100%;min-height:48px;border:2px solid #dee2e6;border-radius:10px;padding:0 10px;font-size:16px"></label>
    </div>
    <div class="import-summary" style="margin-top:6px">應煮 <b id="eggTotal">0</b> 顆</div>

    <h3 style="margin:16px 0 6px">主食（新式）<span class="hint">大人×係數＋小孩×係數</span></h3>
    <div class="hint" id="prepKidNote" style="margin-bottom:6px"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <label class="hint">飯大人係數<input type="number" id="riceAdult" step="0.05" min="0" style="width:100%;min-height:48px;border:2px solid #dee2e6;border-radius:10px;padding:0 10px;font-size:16px"></label>
      <label class="hint">飯小孩係數<input type="number" id="riceChild" step="0.05" min="0" style="width:100%;min-height:48px;border:2px solid #dee2e6;border-radius:10px;padding:0 10px;font-size:16px"></label>
      <label class="hint">粥大人係數<input type="number" id="porridgeAdult" step="0.05" min="0" style="width:100%;min-height:48px;border:2px solid #dee2e6;border-radius:10px;padding:0 10px;font-size:16px"></label>
      <label class="hint">粥小孩係數<input type="number" id="porridgeChild" step="0.05" min="0" style="width:100%;min-height:48px;border:2px solid #dee2e6;border-radius:10px;padding:0 10px;font-size:16px"></label>
    </div>
    <div class="import-summary" style="margin-top:6px">飯量 <b id="riceNum">0</b> 杯　粥量 <b id="porridgeNum">0</b> 杯</div>
    <div style="margin-top:8px">
      <label class="hint">特殊主食除數（大人＋小孩×0.5）÷除數<input type="number" id="specialDiv" min="1" style="width:100%;min-height:48px;border:2px solid #dee2e6;border-radius:10px;padding:0 10px;font-size:16px"></label>
    </div>
    <div class="import-summary" style="margin-top:6px">特殊主食 <b id="specialNum">0</b></div>

    <button class="btn subtle full" id="prepCloseBtn" style="margin-top:16px">關閉</button>
  </div>
</div>

<input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.txt,.tsv" hidden>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
