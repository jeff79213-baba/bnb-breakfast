<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>早餐管理</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#e8590c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="早餐管理">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <h1>🍳 早餐管理</h1>
    <div id="todayLabel" class="today-label"></div>
  </div>
  <button id="menuBtn" class="icon-btn" aria-label="功能選單">☰</button>
</header>

<main>
  <!-- 統計區 -->
  <section class="stats-section">
    <div class="stats-grid" style="grid-template-columns:repeat(5,1fr)">
      <button class="stat-card hot" data-filter="hot">
        <span class="stat-num" id="statHot">0</span>
        <span class="stat-label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e8590c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:3px"><path d="M6 16 Q6 20 12 20 Q18 20 18 16"/><path d="M6 16 H18"/><path d="M8 7 C8 8.2 9 8.8 8 10 C7 11.2 9 11.8 8 13"/><path d="M12 5 C12 6.2 13 6.8 12 8 C11 9.2 13 9.8 12 11"/><path d="M16 7 C16 8.2 17 8.8 16 10 C15 11.2 17 11.8 16 13"/></svg>熟食</span>
      </button>
      <button class="stat-card normal" data-filter="normal">
        <span class="stat-num" id="statNormal">0</span>
        <span class="stat-label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f9e44" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:3px"><rect x="5" y="8" width="14" height="10" rx="2"/><path d="M5 12 H19"/><path d="M7 10 H7.01"/><path d="M10 14 H10.01"/><path d="M13 10 H13.01"/></svg>一般</span>
      </button>
      <button class="stat-card addon" data-filter="addon" style="border-top:3px solid #fcc419">
        <span class="stat-num" id="statAddon" style="color:#e67700">0</span>
        <span class="stat-label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e67700" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:3px"><circle cx="12" cy="12" r="7"/><path d="M12 8 V14"/><path d="M9 11 H12"/><path d="M15 14 H15.01"/></svg>加購</span>
      </button>
      <button class="stat-card done" data-filter="completed">
        <span class="stat-num" id="statDone">0</span>
        <span class="stat-label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1971c2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:3px"><circle cx="9" cy="7" r="2.2"/><path d="M9 9.5 V13"/><path d="M6 12 H12"/><path d="M6 13 V16"/><path d="M12 13 V16"/><rect x="13.5" y="11" width="5" height="3" rx="0.8"/><path d="M15 14 V16 H17"/></svg>已用餐</span>
      </button>
      <button class="stat-card pending" data-filter="pending">
        <span class="stat-num" id="statPending">0</span>
        <span class="stat-label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e67700" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:3px"><path d="M3 13 Q3 18 9 18 T21 13"/><path d="M7 9 Q8 10 7 11"/><path d="M17 6 Q18 6.5 19 6 Q18 7 19 7.5"/><text x="13" y="8" font-size="6" fill="#e67700" stroke="none" font-family="sans-serif">Z</text></svg>未用餐</span>
      </button>
    </div>

    <div class="progress-wrap">
      <div class="progress-text"><span id="progressLabel">0 / 0 間</span></div>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <!-- 熱食警示（核心快速功能） -->
    <button id="hotAlertBanner" class="hot-banner hidden"></button>
  </section>

  <!-- 篩選列 -->
  <nav class="chips" id="filterChips">
    <button class="chip active" data-filter="all">全部</button>
    <button class="chip hot" data-filter="hot">🔥 熱食</button>
    <button class="chip normal" data-filter="normal">🥐 一般</button>
    <button class="chip pending" data-filter="pending">⏳ 未用餐</button>
    <button class="chip done" data-filter="completed">✅ 已用餐</button>
  </nav>

  <!-- 房號卡片 -->
  <section class="grid" id="roomGrid"></section>

  <!-- 空白狀態 -->
  <section class="empty-state hidden" id="emptyState">
    <div class="empty-icon">🍽️</div>
    <p class="empty-title">還沒有任何房號</p>
    <p class="empty-sub">先新增房號並選擇早餐種類，或直接匯入 Excel / CSV 資料</p>
    <div class="empty-actions">
      <button class="btn primary" id="emptyAddBtn">➕ 新增房號</button>
      <button class="btn" id="emptyImportBtn">📂 匯入資料</button>
    </div>
  </section>
</main>

<!-- 功能選單 -->
<div class="modal-backdrop hidden" id="menuModal">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>功能選單</h2>
    <button class="btn list-btn" id="menuManageBtn">🏠 管理房號</button>
    <button class="btn list-btn" id="menuImportBtn">📂 匯入資料（Excel / CSV）</button>
    <button class="btn list-btn" id="menuExportBtn">📤 匯出今日紀錄</button>
    <button class="btn list-btn subtle" id="menuCloseBtn">關閉</button>
  </div>
</div>

<!-- 管理房號 -->
<div class="modal-backdrop hidden" id="manageModal">
  <div class="sheet tall">
    <div class="sheet-handle"></div>
    <h2>管理房號</h2>
    <div class="add-row">
      <input type="text" id="newRoomInput" inputmode="numeric" placeholder="輸入房號，可用逗號一次加入多間">
      <select id="newRoomType"></select>
      <button class="btn primary" id="addRoomBtn">新增</button>
    </div>
    <div class="manage-list" id="manageList"></div>
    <button class="btn subtle full" id="manageCloseBtn">完成</button>
  </div>
</div>

<!-- 匯入預覽 -->
<div class="modal-backdrop hidden" id="importModal">
  <div class="sheet tall">
    <div class="sheet-handle"></div>
    <h2>匯入預覽</h2>
    <div id="importSummary" class="import-summary"></div>
    <div id="importIssues" class="import-issues"></div>
    <div id="importPreviewList" class="import-preview"></div>
    <p class="hint">⚠️ 匯入會取代現有的房號清單（用餐紀錄保留）</p>
    <div class="row-actions">
      <button class="btn danger" id="importCancelBtn">取消</button>
      <button class="btn primary" id="importConfirmBtn">確認匯入</button>
    </div>
  </div>
</div>

<!-- 單一房號動作 -->
<div class="modal-backdrop hidden" id="roomModal">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="roomModalTitle">101</h2>
    <label class="field-label">早餐種類</label>
    <select id="roomModalType"></select>
    <div class="row-actions">
      <button class="btn danger" id="roomDeleteBtn">刪除房號</button>
      <button class="btn primary" id="roomSaveBtn">儲存</button>
    </div>
    <button class="btn subtle full" id="roomCloseBtn">取消</button>
  </div>
</div>

<!-- 不加購改加購 -->
<div class="modal-backdrop hidden" id="mealEditModal">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="mealEditTitle">修改用餐</h2>
    <p class="hint" id="mealEditHint"></p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
      <label>大人 <input type="number" id="mealAdultInput" inputmode="numeric" min="0" style="width:100%;min-height:52px;border:2px solid #dee2e6;border-radius:12px;padding:0 14px;font-size:18px"></label>
      <label>小孩 <input type="number" id="mealChildInput" inputmode="numeric" min="0" style="width:100%;min-height:52px;border:2px solid #dee2e6;border-radius:12px;padding:0 14px;font-size:18px"></label>
    </div>
    <div class="row-actions">
      <button class="btn" id="mealCancelBtn">取消</button>
      <button class="btn primary" id="mealSaveBtn">確認改為加購</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.txt,.tsv" hidden>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
